<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Advent Calendar 🎄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
    </div>

    <div class="container">
        <header>
            <h1>🎬 Movie Advent Calendar 🎄</h1>
            <p class="subtitle">28 Days of Holiday Movies • November 28 - December 25</p>
            <div class="header-actions">
                <button id="shareBtn" class="btn btn-share">📤 Share Calendar</button>
                <button id="resetBtn" class="btn btn-reset" disabled>🔄 Reset Calendar</button>
            </div>
        </header>

        <div id="calendarGrid" class="calendar-grid">
            <!-- Boxes will be generated by JavaScript -->
        </div>

        <div id="movieModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="movie-reveal">
                    <img id="moviePoster" src="" alt="Movie Poster" class="movie-poster">
                    <div class="movie-info">
                        <h2 id="movieTitle"></h2>
                        <p id="movieDay"></p>
                    </div>
                </div>
            </div>
        </div>

        <div id="shareModal" class="modal">
            <div class="modal-content share-modal-content">
                <span class="close">&times;</span>
                <h2>Share Your Calendar 🎁</h2>
                <p>Copy this link to share your movie calendar with others!</p>
                <div class="share-link-container">
                    <input type="text" id="shareLink" readonly>
                    <button id="copyBtn" class="btn btn-copy">📋 Copy</button>
                </div>
                <p class="share-note">Anyone with this link will see the same movie sequence, but track their own opened boxes independently.</p>
            </div>
        </div>
    </div>

    <script src="movies.js"></script>
    <script src="app.js"></script>
</body>
</html>
